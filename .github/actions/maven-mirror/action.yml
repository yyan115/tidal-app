name: Google copy of Maven Central
description: Takes the build libraries from the copy of Maven Central that Google runs, which has no limit on downloads.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$HOME/.gradle/init.d"
        cat > "$HOME/.gradle/init.d/mirror.init.gradle" <<'EOF'
        // Used by the CI only. Maven Central refuses the runners of the CI with the status 429 when many of them ask at the same time, and a job then stops before
        // its first test. Google runs a copy of Maven Central that has no such limit. This puts it before the other repositories, for the plugins and for the libraries.
        // Everything that the mirror does not hold is still taken from the original repositories.
        settingsEvaluated { settings ->
            def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
            [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
                def original = repositories.toList()
                repositories.clear()
                repositories.maven { url = uri(mirror) }
                original.each { repositories.add(it) }
            }
        }
        EOF
