version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    # A new version waits three days before it is proposed. Security updates are not delayed.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns:
          - androidx.compose*
      media3:
        patterns:
          - androidx.media3*
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      other:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Major Android Gradle Plugin upgrades need build changes and are done by hand.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
      # Gradle 9 needs Android Gradle Plugin 9.1 or newer.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major
      # The next releases of these libraries need compile SDK 37, which needs Android Gradle Plugin 9.1 or newer.
      # Remove these rules after the plugin upgrade.
      - dependency-name: androidx.compose:compose-bom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: io.coil-kt.coil3:*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: com.squareup.okhttp3:*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
