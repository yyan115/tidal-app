version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns:
          - androidx.compose*
      media3:
        patterns:
          - androidx.media3*
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      other:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Major Android Gradle Plugin upgrades need build changes and are done by hand.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
