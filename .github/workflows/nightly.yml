name: Nightly

# The checks of a pull request run three Android versions and give each of them a third of the screen matrix. This run gives every Android version from 10 to 16
# every row of the matrix, the tour of the screens and the crawler, on five sizes of display. It runs at night and by hand, and nothing waits for it.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Android ${{ matrix.api }}, ${{ matrix.screen.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The free plan runs twenty jobs at a time for the whole account, so some room is left for a pull request that is checked at the same time.
      max-parallel: 14
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
        screen:
          - { name: small phone, size: 720x1280, density: 320 }
          - { name: phone, size: 1080x2400, density: 420 }
          - { name: large phone, size: 1440x3120, density: 560 }
          - { name: foldable, size: 1840x2208, density: 420 }
          - { name: tablet, size: 1600x2560, density: 320 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: ./.github/actions/maven-mirror
      - name: Allow KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FULL_MATRIX: '1'
          SCREEN: ${{ matrix.screen.size }}@${{ matrix.screen.density }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            scripts/prepare_emulator.sh
            adb shell pm disable-user --user 0 com.google.android.gms || true
            adb shell settings put global heads_up_notifications_enabled 0
            mkdir -p logcat
            adb logcat -v threadtime -b main,system,crash '*:I' > logcat/android-${{ matrix.api }}.txt &
            scripts/run_device_tests.sh ${{ matrix.api }} 2
      - name: Upload device reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.api }}-${{ matrix.screen.size }}-results
          retention-days: 7
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            shard-results/
            logcat/
