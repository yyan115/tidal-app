name: Release

# Releasing OpenTune
#
# One-time setup
#   Create a PKCS12 keystore with the key alias "opentune". Keep the keystore and its password outside the repository, with an
#   encrypted backup, because every update must use the same key. Add two repository secrets under Settings, Secrets and
#   variables, Actions: RELEASE_KEYSTORE_BASE64 (the keystore, base64-encoded) and RELEASE_KEYSTORE_PASSWORD (its password,
#   which is also the key password). The SHA-256 of the signing certificate is in .github/signing-certificate.sha256 and the
#   workflow refuses an APK signed with any other certificate. Change that file and the fingerprint in README.md only when the
#   key is rotated on purpose.
#
# Cutting a release
#   main is protected, so a release has three parts.
#   1. A pull request that prepares the version. List every change that users can see under Unreleased in CHANGELOG.md. On a
#      branch run "python3 scripts/release.py prepare X.Y.Z", commit VERSION, CHANGELOG.md and fastlane, and open a pull request
#      titled "Release X.Y.Z". Merge it when the checks pass.
#   2. A run of this workflow on main with the same version. "dry_run" builds and tests without creating a release.
#      The workflow runs the checks, verifies VERSION and the changelog entry, builds and signs the APK, checks its certificate,
#      attests its provenance, installs the previous release on Android 8 and 16 emulators, installs the new APK over it, starts
#      both and fails when the app stops or logs a crash, and then creates a draft release with the APK and SHA256SUMS.
#      Versions below 1.0.0 are marked as prereleases. A draft is invisible to downloaders and to the update check in the app.
#   3. Download the APK from the draft, install it over the current version on a phone, check sign-in, playback and a download,
#      and publish the draft on GitHub or with "gh release edit vX.Y.Z --draft=false".
#
# Local checks
#   scripts/smoke_upgrade.sh NEW.apk PREVIOUS.apk runs the upgrade check with an emulator or a device connected.
#   For a local signed build set OPENTUNE_KEYSTORE, OPENTUNE_STORE_PASSWORD, OPENTUNE_KEY_PASSWORD and, when the alias differs,
#   OPENTUNE_KEY_ALIAS in a private environment and run "./gradlew :app:assembleRelease". Keep these values out of shell history
#   and out of committed Gradle properties.
#
# Version numbers
#   VERSION holds MAJOR.MINOR.PATCH. Gradle derives the Android version code as MAJOR x 1,000,000 + MINOR x 1,000 + PATCH,
#   so each component must stay at or below 999.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0. It must be the version of VERSION on main.
        required: true
        type: string
      dry_run:
        description: Build, sign and test, but create no release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build and sign
    needs: check
    if: ${{ !github.event.repository.fork && (github.ref == 'refs/heads/main' || inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version
        run: |
          python3 scripts/release.py verify "$VERSION"
          if [ "$DRY_RUN" != "true" ] && git rev-parse --quiet --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          python3 scripts/release.py notes "$VERSION" > notes.md
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opentune-release.p12"
      - name: Build signed release
        env:
          OPENTUNE_KEYSTORE: ${{ runner.temp }}/opentune-release.p12
          OPENTUNE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: opentune
          OPENTUNE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and prepare files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/opentune-$VERSION.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "dist/opentune-$VERSION.apk" | tee "$RUNNER_TEMP/certs.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          expected=$(tr -d '[:space:]' < .github/signing-certificate.sha256)
          if [ "$actual" != "$expected" ]; then
            echo "The APK is signed with a different certificate than .github/signing-certificate.sha256." >&2
            exit 1
          fi
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          retention-days: 7
          path: |
            dist
            notes.md
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/opentune-release.p12"

  upgrade:
    name: Upgrade test on Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Download the previous release
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          mkdir previous
          if [ -n "$tag" ]; then gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous; fi
          ls previous
      - name: Allow KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: SMOKE_SCREENSHOT=upgrade-${{ matrix.api }}.png bash scripts/smoke_upgrade.sh "release/dist/opentune-$VERSION.apk" "$(ls previous/*.apk 2>/dev/null | head -1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upgrade-${{ matrix.api }}
          retention-days: 7
          path: upgrade-${{ matrix.api }}.png
          if-no-files-found: ignore

  publish:
    name: Create the draft release
    needs: upgrade
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Create the draft
        run: |
          flags=()
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" release/dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "OpenTune $VERSION" --notes-file release/notes.md "${flags[@]}"
